<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>lh3 test</title></head>
<body style="background:#000;color:#0f0;font:13px monospace;padding:8px;">
<div id="out">loading...</div>
<script>
var URL = "https://lh3.googleusercontent.com/ppa/AFv4vno7unRBesAACdEAWCDeUVBxaTW0uR4l_nlA24HclHObevPJIuky4ymav5loGBcmIzC4gGlVhxLe8Tyb-9HmINOieerGbVUJRQ=w1920-h1080";
var out = document.getElementById("out");
function log(s){ out.textContent = out.textContent + s + "\n"; }
log("start");
function run(label, init){
  log("--- " + label + " ---");
  var t0 = Date.now();
  return fetch(URL, init).then(function(r){
    log("status=" + r.status + " time=" + (Date.now()-t0) + "ms");
    if (r.ok){ return r.blob().then(function(b){ log("blob=" + b.size); }); }
  }).catch(function(e){
    var c = e && e.cause ? (e.cause.name||e.cause.code||e.cause.message||String(e.cause)) : "";
    log("THROW name=" + (e&&e.name) + " msg=" + (e&&e.message) + " cause=" + c + " time=" + (Date.now()-t0) + "ms");
  });
}
run("ANON", {}).then(function(){ return run("BEARER", {headers:{"Authorization":"Bearer xxx"}}); }).then(function(){ log("DONE"); });
</script>
</body></html>

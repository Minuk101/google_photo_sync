<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TEST</title></head>
<body style="background:#000;color:#0f0;font:20px monospace;padding:40px;">
<p id="log"></p>
<script>
const GH = 'https://raw.githubusercontent.com/Minuk101/google_photo_sync/main/photos.json?t=';
const log = document.getElementById('log');

async function check() {
  try {
    const r = await fetch(GH + Date.now());
    const m = await r.json();
    log.textContent = 'OK: ' + (m.photos||[]).length + ' photos | updated: ' + m.updated + ' | ' + new Date().toLocaleTimeString();
  } catch(e) {
    log.textContent = 'FAIL: ' + e.message + ' | ' + new Date().toLocaleTimeString();
  }
}
check();
setInterval(check, 5000);
</script>
</body></html>
